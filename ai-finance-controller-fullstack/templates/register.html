{% extends "base.html" %}
{% block title %}Create account — AI Finance Controller{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />{% endblock %}
{% block body %}
<div id="ambient-scene"></div>
<div class="auth-shell">
  <a href="{{ url_for('pages.home') }}" class="brand-link" style="margin-bottom:32px; display:flex; align-items:center; gap:12px;">
    <div class="brand-mark">FC</div>
    <div class="brand-text"><div class="eyebrow">AI Finance Controller</div><h1 style="margin:0;">Create account</h1></div>
  </a>

  <div class="panel auth-panel">
    <div id="form-alert"></div>
    <form id="register-form">
      <div class="field"><label for="username">Username</label><input type="text" id="username" required minlength="3" /></div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" required /></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required minlength="8" /></div>
      <p class="hint">At least 8 characters.</p>
      <button type="submit" class="btn btn-primary btn-block">Create account →</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="{{ url_for('pages.login_page') }}">Sign in</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/scene-ambient.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/auth.js') }}"></script>
<script>
  initAmbientScene(document.getElementById('ambient-scene'), { density: 500 });
  wireRegisterForm();
</script>
{% endblock %}
