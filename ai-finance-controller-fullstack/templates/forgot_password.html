{% extends "base.html" %}
{% block title %}Forgot password — AI Finance Controller{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />{% endblock %}
{% block body %}
<div id="ambient-scene"></div>
<div class="auth-shell">
  <a href="{{ url_for('pages.home') }}" class="brand-link" style="margin-bottom:32px; display:flex; align-items:center; gap:12px;">
    <div class="brand-mark">FC</div>
    <div class="brand-text"><div class="eyebrow">AI Finance Controller</div><h1 style="margin:0;">Reset your password</h1></div>
  </a>

  <div class="panel auth-panel">
    <div id="form-alert"></div>
    <form id="forgot-form">
      <div class="field"><label for="email">Account email</label><input type="email" id="email" required /></div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link →</button>
    </form>
    <div id="reset-link-box" style="display:none;"></div>
    <div class="auth-switch"><a href="{{ url_for('pages.login_page') }}">← Back to sign in</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/scene-ambient.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/auth.js') }}"></script>
<script>
  initAmbientScene(document.getElementById('ambient-scene'), { density: 500 });
  wireForgotPasswordForm();
</script>
{% endblock %}
